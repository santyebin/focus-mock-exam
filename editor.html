<style>
  .ed { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
  @media (max-width: 980px) { .ed { grid-template-columns: minmax(0, 1fr); } }
  .ed .panel { display: grid; gap: 14px; }
  .ed-preview .gx { height: auto; min-height: 420px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .ed-preview .gx-main { max-height: 620px; }
  .checks li { margin: 4px 0; }
  .checks .ok { color: var(--good); } .checks .bad { color: var(--bad); } .checks .warn { color: var(--warn); }
  .code { width: 100%; min-height: 200px; font: 12.5px/1.5 var(--font-mono); white-space: pre; overflow: auto; }
  .choice-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: start; }
  .choice-row input[type="radio"] { margin-top: 12px; accent-color: var(--accent); }
</style>
